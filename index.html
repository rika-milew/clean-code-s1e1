<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet">
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
      charset="utf-8">
  </head>
  <body class="page">
    <div class="header">
      <img class="header-image" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
      <a
        class="header-more-link"
        href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </div>
    <div class="main">
      <p id="add-section">
        <label class="add-task-label" for="new-task-input">Add Item</label>
        <div class="row-wrapper">
          <input
            id="newTaskInput"
            class="new-task-input"
            type="text">
          <button class="add-button">Add</button>
        </div>
      </p>
      <h3 class="list-heading">Todo</h3>
      <ul id="incompleteTasks" class="list">
        <li class="task-item">
          <input type="checkbox" class="input-checkbox">
          <label class="task-label">Pay Bills</label>
          <input type="text" class="task-input">
          <button class="edit-button">Edit</button>
          <button class="delete-button">
            <img class="delete-icon" src="./remove.svg" alt="delete">
          </button>
        </li>
        <li class="task-item edit-mode">
          <input type="checkbox" class="input-checkbox">
          <label class="task-label">Go Shopping</label>
          <input
            type="text"
            value="Go Shopping"
            class="task-input">
          <button class="edit-button">Save</button>
          <button class="delete-button">
            <img class="delete-icon" src="./remove.svg" alt="delete">
          </button>
        </li>
      </ul>
      <h3 class="list-heading">Completed</h3>
      <ul id="completedTasks" class="list completed-list">
        <li class="task-item">
          <input type="checkbox" class="input-checkbox" checked>
          <label class="task-label">See the Doctor</label>
          <input type="text" class="task-input">
          <button class="edit-button">Edit</button>
          <button class="delete-button">
            <img class="delete-icon" src="./remove.svg" alt="delete">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
