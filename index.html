<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet">
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
      charset="utf-8">
  </head>
  <body class="body">
    <div class="aaa">
      <img class="image eisenhower-matrix" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
      <a
        class="more_inf"
        href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </div>
    <div class="centered-main-page-element">
      <p id="topSectionForAddingElementToList">
        <label class="label" for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input
            id="new-task"
            class="input task"
            type="text">
          <button class="button">Add</button>
        </div>
      </p>
      <h3 class="heading3">Todo</h3>
      <ul id="incompleteTasks" class="list">
        <li class="basic-task">
          <input type="checkbox" class="input">
          <label class="label task basic-label">Pay Bills</label>
          <input type="text" class="input task list-input">
          <button class="button edit">Edit</button>
          <button class="button delete">
            <img class="image delete-image" src="./remove.svg" alt="delete">
          </button>
        </li>
        <li class="basic-task editmode">
          <input type="checkbox" class="input">
          <label class="label task basic-label">Go Shopping</label>
          <input
            type="text"
            value="Go Shopping"
            class="input task list-input">
          <button class="button edit">Save</button>
          <button class="button delete">
            <img class="image" src="./remove.svg" alt="delete">
          </button>
        </li>
      </ul>
      <h3 class="heading3">Completed</h3>
      <ul id="completed-tasks" class="list">
        <li class="basic-task">
          <input type="checkbox" class="input" checked>
          <label class="label task basic-label">See the Doctor</label>
          <input type="text" class="input task list-input">
          <button class="button edit">Edit</button>
          <button class="button delete">
            <img class="image" src="./remove.svg" alt="delete">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
