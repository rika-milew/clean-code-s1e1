<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <meta name="description" content="Todo app for organizing tasks">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet">
    <link
      rel="stylesheet"
      href="style.css"
      media="screen">
  </head>
  <body class="page">
    <header class="header">
      <img class="header-img" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
      <a
        class="header-link"
        href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </header>
    <main class="main">
      <h1 class="hidden">Todo App</h1>
      <section class="add-section" aria-labelledby="addTitle">
        <h2 id="addTitle" class="hidden">Add a new task</h2>
        <form class="add-form">
          <label class="add-label" for="addInput">Add Item</label>
          <div class="row">
            <input
              id="addInput"
              class="add-input"
              type="text"
              required>
            <button class="add-btn" type="submit">Add</button>
          </div>
        </form>
      </section>
      <section class="todo-section" aria-labelledby="toDoTitle">
        <h2 id="toDoTitle" class="list-title">Todo</h2>
        <ul id="toDoList" class="list">
          <li class="task-item">
            <input type="checkbox" class="checkbox">
            <label class="task-name">Pay Bills</label>
            <input type="text" class="task-input">
            <button class="edit-btn">Edit</button>
            <button class="delete-btn">
              <img class="delete-icon" src="./remove.svg" alt="delete">
            </button>
          </li>
          <li class="task-item edit-mode">
            <input type="checkbox" class="checkbox">
            <label class="task-name">Go Shopping</label>
            <input
              type="text"
              value="Go Shopping"
              class="task-input">
            <button class="edit-btn">Save</button>
            <button class="delete-btn">
              <img class="delete-icon" src="./remove.svg" alt="delete">
            </button>
          </li>
        </ul>
      </section>
      <section class="done-section" aria-labelledby="doneTitle">
        <h2 id="doneTitle" class="list-title">Completed</h2>
        <ul id="doneList" class="list list-done">
          <li class="task-item">
            <input type="checkbox" class="checkbox" checked>
            <label class="task-name">See the Doctor</label>
            <input type="text" class="task-input">
            <button class="edit-btn">Edit</button>
            <button class="delete-btn">
              <img class="delete-icon" src="./remove.svg" alt="delete">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
